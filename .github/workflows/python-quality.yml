name: NeuroVision Python quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-quality:
    name: Python 3.12 quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Generate dependency lock
        run: uv lock --python 3.12
      - name: Commit generated lockfile to same-repository PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock is already current; no commit needed."
          else
            git commit -m "build: add generated Python 3.12 dependency lock"
            git push origin "HEAD:${PR_BRANCH}"
          fi
      - name: Install locked project and development dependencies
        run: uv sync --locked --all-groups
      - name: Run unit tests with coverage
        run: uv run pytest --cov=neurovision --cov-report=term-missing
      - name: Run Ruff lint
        run: uv run ruff check .
      - name: Run mypy
        run: uv run mypy
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify Ruff formatting
        run: uv run ruff format --check .
      - name: Upload generated dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurovision-uv-lock
          path: uv.lock
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload package distributions
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neurovision-python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

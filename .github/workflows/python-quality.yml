name: NeuroVision Python quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python 3.12 quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify dependency lock is current
        run: uv lock --check --python 3.12
      - name: Install locked project and development dependencies
        run: uv sync --locked --all-groups
      - name: Install image-test dependency
        run: uv pip install --python .venv/bin/python Pillow==12.2.0
      - name: Format audit script for review
        run: uv run ruff format scripts/audits/nonzero_candidate_investigation.py
      - name: Upload formatted audit script for review
        uses: actions/upload-artifact@v4
        with:
          name: nv-dup-audit-03-formatted-script
          path: scripts/audits/nonzero_candidate_investigation.py
          retention-days: 1
      - name: Run unit tests with coverage
        run: uv run pytest --cov=neurovision --cov-report=term-missing
      - name: Run Ruff lint
        run: uv run ruff check .
      - name: Verify Ruff formatting
        run: uv run ruff format --check --diff .
      - name: Run mypy
        run: uv run mypy
      - name: Build wheel and source distribution
        run: uv build
      - name: Upload package distributions
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neurovision-python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  docker-smoke:
    name: Docker non-root smoke test
    runs-on: ubuntu-latest
    needs: python-quality
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --pull --tag neurovision:ci .
      - name: Verify package import, production settings and non-root data access
        run: |
          docker run --rm --entrypoint python neurovision:ci -c "import os; from pathlib import Path; from neurovision import __version__; from neurovision.config.settings import get_settings; settings = get_settings(); assert os.getuid() == 10001; assert settings.environment == 'production'; assert settings.data_dir == Path('/app/data'); probe = settings.data_dir / '.ci-write-check'; probe.write_text('ok'); probe.unlink(); print(f'NeuroVision {__version__}: non-root container smoke test passed')"
